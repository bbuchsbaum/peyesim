[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peyesim"
version = "0.1.0"
description = "Analysis of eye-movement data – Python port of the R eyesim package"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bradley Buchsbaum", email = "brad.buchsbaum@gmail.com" },
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "statsmodels>=0.13",
    "pot>=0.9",
    "networkx>=2.8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Documentation = "https://bbuchsbaum.github.io/peyesim/"
Repository = "https://github.com/bbuchsbaum/peyesim"
Issues = "https://github.com/bbuchsbaum/peyesim/issues"

[project.optional-dependencies]
data = ["pyreadr>=0.5"]
dev = ["pytest>=7", "pytest-xdist"]
viz = ["matplotlib>=3.5"]
docs = [
    "quartodoc>=0.11,<0.12",
    "griffe>=1.14,<1.15",
    "jupyter",
    "jupyter-cache",
    "ipykernel",
    "nbformat",
    "nbclient",
    "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["peyesim*"]

[tool.setuptools.package-data]
peyesim = ["data/*.rda", "data/*.json.gz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
