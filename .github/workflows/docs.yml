name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "tools/build_docs.py"
      - "tools/docs_lint.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install package + docs deps
        run: pip install -e ".[docs,viz]"

      - name: Lint authored docs
        run: python tools/docs_lint.py

      - name: Execute pages and generate the API reference
        run: python tools/build_docs.py

      - name: Build site
        working-directory: docs
        env:
          DOCS_BASE_PATH: /peyesim
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run types:check
          npm run build
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
