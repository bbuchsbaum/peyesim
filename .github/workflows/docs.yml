name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + docs deps
        run: |
          pip install -e ".[docs,viz]"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Show docs dependency versions
        run: |
          python -c "import importlib.metadata as md; print('quartodoc', md.version('quartodoc')); print('griffe', md.version('griffe'))"

      - name: Build API reference
        run: cd docs && quartodoc build --config _quartodoc.yml

      - name: Render site
        run: cd docs && quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
